when:
  event: push
  branch: main

steps:
  - name: deploy
    image: ubuntu:latest
    environment:
      WEB_HOST:
        from_secret: WEB_HOST
      WEB_USER:
        from_secret: WEB_USER
      WEB_PASS:
        from_secret: WEB_PASS
    commands:
      - apt-get update && apt-get install -y openssh-client sshpass
      - bash deploy.sh

  - name: mirror
    image: ubuntu:latest
    when:
      branch: main
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - apt-get update && apt-get install -y git
      - git remote add github https://$GITHUB_TOKEN@github.com/naaulu/naaulu-website.git
      - git push github main -f
